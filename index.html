
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>INCISANT | Private Marketing Consultancy</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #08090b;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      width: 84px;
      height: 84px;
      margin-bottom: 35px;
    }
    h1 {
      font-size: clamp(30px, 8vw, 46px);
      font-weight: 500;
      letter-spacing: -2px;
      margin: 0 0 20px;
    }
    .positioning {
      max-width: 330px;
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #a7a9ad;
      margin: 0 0 45px;
    }
    .apply {
      display: inline-block;
      padding: 16px 56px;
      border: 1px solid #e9e9e9;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 3px;
      transition: 0.2s ease;
    }
    .apply:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 100 100"
         xmlns="http://www.w3.org/2000/svg"
         fill="none" stroke="white"
         stroke-width="2.2"
         stroke-linecap="round">
      <path d="M18 75 L79 17"/>
      <path d="M23 28 L79 73"/>
      <circle cx="17" cy="78" r="10"/>
      <circle cx="17" cy="24" r="10"/>
    </svg>

    <h1>INCISANT</h1>

    <p class="positioning">
      Marketing Consultancy for 7 &amp; 8 Figure Brands
    </p>

    <a class="apply"
       href="https://ig.me/m/incisant"
       target="_blank"
       rel="noopener noreferrer">
       APPLY
    </a>
  </main>
</body>
</html>
